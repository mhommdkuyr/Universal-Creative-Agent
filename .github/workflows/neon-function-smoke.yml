name: Neon Function Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://br-sparkling-dust-ael6x30u-ucoa.compute.c-2.us-east-2.aws.neon.tech/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"runtime":"neon-function"' /tmp/health.json
          grep -q '"version":"neon-v1"' /tmp/health.json
      - name: Function contract
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          import json
          x=json.load(open('/tmp/health.json'))
          print(x.get('service',''))
          PY
          )" = "ucoa-agent"
          echo "Neon function health contract passed"
