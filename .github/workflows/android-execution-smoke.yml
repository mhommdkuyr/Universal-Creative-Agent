name: Android Execution Smoke

# Acceptance gate: APK + embedded local model + Accessibility + real foreground verification.
# local brain acceptance v3

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-execution-smoke.yml'

concurrency:
  # Never let a hung emulator smoke block the newest acceptance build.
  group: android-execution-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  execution-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache embedded local model
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/ucoa_local_model.litertlm
          key: ucoa-qwen3-0.6b-nothink-int4-v2
      - name: Install Android build toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK with embedded local model
        run: gradle -p android assembleDebug --stacktrace
      - name: Verify model is physically packaged in APK
        run: |
          set -eu
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/ucoa_local_model.litertlm'
      - name: Real accessibility execution test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            APK="$(find /home/runner/work -type f -path '*/android/app/build/outputs/apk/debug/app-debug.apk' -print -quit)"
            test -n "$APK"
            test -s "$APK"
            adb install -r "$APK"
            adb shell settings put secure enabled_accessibility_services com.ucoa.app/.UcoaAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am force-stop com.ucoa.app || true
            adb shell am force-stop com.android.settings || true
            adb shell am start -n com.ucoa.app/.MainActivity --es smoke_task 'افتح الإعدادات' --ez smoke_local_only true
            EXEC_OK=false
            FG_OK=false
            LOCAL_MODEL_OK=false
            LOCAL_ROUTE_OK=false
            for i in $(seq 1 90); do
              LOG=$(adb logcat -d || true)
              if printf '%s' "$LOG" | grep -q 'UCOA_LOCAL_EXECUTION_OK app='; then EXEC_OK=true; fi
              if printf '%s' "$LOG" | grep -q 'LOCAL_BRAIN.*bundled=true'; then LOCAL_MODEL_OK=true; fi
              if printf '%s' "$LOG" | grep -q 'LOCAL_BRAIN.*العقل المحلي فهم المهمة'; then LOCAL_ROUTE_OK=true; fi
              FG=$(adb shell dumpsys window windows | grep -m1 'mCurrentFocus' || true)
              if printf '%s' "$FG" | grep -q 'com.android.settings'; then FG_OK=true; fi
              if [ "$EXEC_OK" = true ] && [ "$FG_OK" = true ] && [ "$LOCAL_MODEL_OK" = true ] && [ "$LOCAL_ROUTE_OK" = true ]; then break; fi
              sleep 1
            done
            mkdir -p "$GITHUB_WORKSPACE/smoke-diagnostics"
            adb logcat -d -v threadtime | tail -n 5000 > "$GITHUB_WORKSPACE/smoke-diagnostics/ucoa_logcat.txt" || true
            adb shell dumpsys accessibility > "$GITHUB_WORKSPACE/smoke-diagnostics/ucoa_accessibility.txt" || true
            adb shell dumpsys window windows > "$GITHUB_WORKSPACE/smoke-diagnostics/ucoa_windows.txt" || true
            echo "EXEC_OK=$EXEC_OK FG_OK=$FG_OK LOCAL_MODEL_OK=$LOCAL_MODEL_OK LOCAL_ROUTE_OK=$LOCAL_ROUTE_OK"
            test "$EXEC_OK" = true
            test "$FG_OK" = true
            test "$LOCAL_MODEL_OK" = true
            test "$LOCAL_ROUTE_OK" = true
            echo 'UCOA_REAL_EXECUTION_SMOKE_OK'
      - name: Upload execution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-execution-diagnostics
          path: smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-debug-apk-execution-smoke
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
