name: Android Execution Smoke

# Acceptance gate: cloud-only APK + Accessibility + real foreground verification.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-execution-smoke.yml'

concurrency:
  group: android-execution-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  execution-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build cloud-only APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Verify cloud-only APK package
        run: |
          set -eu
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'AndroidManifest.xml'
          if unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/ucoa_local_model\\.litertlm'; then exit 1; fi
      - name: Real cloud-only accessibility execution test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/run_execution_smoke.sh
      - name: Upload execution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-execution-diagnostics
          path: smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-debug-apk-execution-smoke
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
