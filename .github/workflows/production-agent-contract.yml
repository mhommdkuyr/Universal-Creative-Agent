name: Production Agent Contract Benchmark

on:
  push:
    branches: [main]
    paths:
      - "server/app.py"
      - "server/production_overrides.py"
      - "server/provider_router.py"
      - ".github/workflows/production-agent-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Plan request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
import json, time, urllib.request, uuid
base="https://ucoa-agent-brain.onrender.com"
task="افتح الإعدادات فقط ولا تغيّر أي إعداد."
payload=json.dumps({"task":task,"attachments":[],"device":{"platform":"android","os_version":"12"},"session_id":"contract-"+uuid.uuid4().hex}).encode()
req=urllib.request.Request(base+"/v1/agent/plan",data=payload,headers={"Content-Type":"application/json"},method="POST")
t=time.perf_counter()
with urllib.request.urlopen(req,timeout=60) as r:
    out=json.loads(r.read().decode())
elapsed=round((time.perf_counter()-t)*1000,2)
print(json.dumps({"elapsed_ms":elapsed,"response":out},ensure_ascii=False))
assert out.get("status")=="completed", out
result=out.get("result") or {}
assert result.get("steps"), result
assert result.get("provider") or result.get("provider_metrics"), result
open("/tmp/plan.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
PY
      - name: Step request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
import json, time, urllib.request, uuid
base="https://ucoa-agent-brain.onrender.com"
payload={
  "task":"افتح الإعدادات فقط ولا تغيّر أي إعداد.",
  "step":0,
  "max_steps":10,
  "history":[],
  "ui_tree":"[]",
  "screenshot_base64":None,
  "installed_apps":["Settings"],
  "attachments":[],
  "capabilities":["open_app_by_name","click_any_text","observe","done"],
  "session_id":"contract-"+uuid.uuid4().hex,
  "approved_risks":False,
  "foreground_package":""
}
req=urllib.request.Request(base+"/v1/agent/step",data=json.dumps(payload,ensure_ascii=False).encode(),headers={"Content-Type":"application/json"},method="POST")
t=time.perf_counter()
with urllib.request.urlopen(req,timeout=60) as r:
    out=json.loads(r.read().decode())
elapsed=round((time.perf_counter()-t)*1000,2)
print(json.dumps({"elapsed_ms":elapsed,"response":out},ensure_ascii=False))
assert out.get("status")=="completed", out
result=out.get("result") or {}
assert result.get("provider") or result.get("provider_metrics"), result
assert int(result.get("wait_after_ms",0) or 0) <= 1500, result
open("/tmp/step.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
PY
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-agent-contract
          path: |
            /tmp/plan.json
            /tmp/step.json
          if-no-files-found: ignore
