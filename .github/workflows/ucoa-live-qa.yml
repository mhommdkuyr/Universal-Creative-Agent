name: UCOA Live Phone QA

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ucoa-live-qa.yml"
      - "server/device_bridge.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  live-phone-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Render bridge
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' https://ucoa-agent-brain.onrender.com/health || true)"
            echo "health=$code attempt=$i"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              break
            fi
            sleep 3
          done
          test -s /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Discover physical Android phone
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ucoa-agent-brain.onrender.com
          get_oidc_token() {
            curl --fail --silent --show-error               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ucoa-live-phone" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          for i in $(seq 1 90); do
            token="$(get_oidc_token)"
            code="$(curl -sS -o /tmp/devices.json -w '%{http_code}'               -H "Authorization: Bearer ${token}"               "$BASE/v1/qa/phone/devices" || true)"
            echo "devices=$code attempt=$i"
            if [ "$code" = "200" ]; then
              cat /tmp/devices.json
              count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("devices") or []))' < /tmp/devices.json)"
              if [ "$count" -gt 0 ]; then
                exit 0
              fi
            fi
            sleep 3
          done
          exit 1

      - name: Execute Settings acceptance on the real phone
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ucoa-agent-brain.onrender.com
          get_oidc_token() {
            curl --fail --silent --show-error               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ucoa-live-phone" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          task='اختبار قبول حي حقيقي: افتح تطبيق الإعدادات فقط. لا تغيّر أي إعداد. أثبت من UCOA نفسه عبر Accessibility UI tree ولقطة الشاشة أن شاشة الإعدادات ظاهرة. فتح متصفح أو بقاء ChatGPT لا يعتبر نجاحًا.'
          body="$(python3 - "$task" <<'PY'
import json,sys
print(json.dumps({
  "kind":"task",
  "task":sys.argv[1],
  "attachments":[],
  "metadata":{
    "qa_suite":"live-phone-single-acceptance",
    "test_suite":"real_device_live_ui_v8",
    "evidence_required":True,
    "no_external_success":True
  }
},ensure_ascii=False))
PY
)"

          token="$(get_oidc_token)"
          queued="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${token}"             -H "Content-Type: application/json"             -d "$body"             "$BASE/v1/qa/phone/commands")"
          echo "$queued"

          command_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["command_id"])' <<<"$queued")"
          test -n "$command_id"

          for i in $(seq 1 120); do
            token="$(get_oidc_token)"
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer ${token}"               "$BASE/v1/qa/phone/commands/$command_id")"
            echo "$state" > /tmp/state.json
            status="$(python3 -c 'import json; print(json.load(open("/tmp/state.json"))["command"]["status"])')"
            echo "poll=$i status=$status"
            if [ "$status" = "completed" ] || [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then
              break
            fi
            sleep 2
          done

          cat /tmp/state.json
          python3 - <<'PY'
import json
d=json.load(open("/tmp/state.json"))["command"]
if d["status"] != "completed":
    raise SystemExit(f"device command status={d['status']}")
r=d.get("result") or {}
if r.get("error"):
    raise SystemExit(f"device result error={r['error']}")
if r.get("completion_verified_by_ucoa") is not True:
    raise SystemExit("completion_verified_by_ucoa is not true")
if r.get("final_foreground") != "com.android.settings":
    raise SystemExit(f"wrong final foreground: {r.get('final_foreground')}")
if int(r.get("steps",0) or 0) <= 0:
    raise SystemExit("no execution steps recorded")
print("REAL_DEVICE_ACCEPTANCE_PASS")
PY
