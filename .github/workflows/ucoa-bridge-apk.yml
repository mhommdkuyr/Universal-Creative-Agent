name: UCOA Cloud Device Bridge APK

on:
  push:
    branches:
      - main
      - ucoa/cloud-device-bridge
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Calculate SHA256
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app-debug.apk.sha256

      - name: Verify APK exists and is installable
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-cloud-device-bridge-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app-debug.apk.sha256
          retention-days: 30

      - name: Publish installable APK summary
        run: |
          echo "UCOA APK ready: android/app/build/outputs/apk/debug/app-debug.apk"
          echo "SHA256: $(cut -d' ' -f1 android/app-debug.apk.sha256)"
