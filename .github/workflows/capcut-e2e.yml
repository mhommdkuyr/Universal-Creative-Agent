name: CapCut E2E
# Production acceptance: build UCOA and exercise the CapCut path on a real Android emulator.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'server/app.py'
      - 'server/app_v3.py'
      - 'server/app_v4_runtime.py'
      - 'server/provider_router.py'
      - 'server/requirements.txt'
      - 'server/ci_capcut_e2e.sh'
      - '.github/workflows/capcut-e2e.yml'

jobs:
  capcut-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build UCOA debug APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Run CapCut E2E on managed Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel off
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell settings put system screen_off_timeout 1800000 || true
            AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
            test -n "$AAPT_PATH"
            export PATH="$(dirname "$AAPT_PATH"):$PATH"
            echo "Using aapt: $(command -v aapt)"
            aapt version
            bash ./server/ci_capcut_e2e.sh
