name: CapCut E2E
# Production acceptance: exercise the current main branch after the OmniRoute bridge change.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'server/app.py'
      - 'server/app_v3.py'
      - 'server/app_v4_runtime.py'
      - 'server/requirements.txt'
      - 'server/ci_capcut_e2e.sh'
      - '.github/workflows/capcut-e2e.yml'

jobs:
  capcut-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android assembleDebug --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./server/ci_capcut_e2e.sh
