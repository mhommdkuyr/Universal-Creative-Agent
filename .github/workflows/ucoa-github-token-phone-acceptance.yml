name: UCOA GitHub Token Phone Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://ucoa-agent-brain.onrender.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for production bridge
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 8 "$BASE/health" || true)"
            echo "health=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Discover active Android phone
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            code="$(curl -sS -o /tmp/devices.json -w '%{http_code}'               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "X-GitHub-Run-ID: ${GITHUB_RUN_ID}"               "$BASE/v1/qa/phone/devices" || true)"
            echo "devices_http=$code attempt=$i"
            if [ "$code" != "200" ]; then
              cat /tmp/devices.json || true
            else
              cat /tmp/devices.json
              count="$(python3 -c 'import json; print(len(json.load(open("/tmp/devices.json")).get("devices") or []))')"
              if [ "$count" -gt 0 ]; then
                exit 0
              fi
            fi
            sleep 3
          done
          exit 1

      - name: Execute safe Settings task on active phone
        run: |
          set -euo pipefail
          task='اختبار القبول الحقيقي: افتح تطبيق الإعدادات فقط. لا تغيّر أي إعداد. يجب إثبات الحالة النهائية من UCOA عبر Accessibility UI tree ولقطة الشاشة.'
          python3 - "$task" > /tmp/body.json <<'PY'
          import json,sys
          print(json.dumps({
            "kind":"task",
            "task":sys.argv[1],
            "attachments":[],
            "metadata":{
              "qa_suite":"github-token-live-phone-acceptance",
              "evidence_required":True,
              "no_external_success":True
            }
          },ensure_ascii=False))
          PY
          queued="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H "X-GitHub-Run-ID: ${GITHUB_RUN_ID}"             -H "Content-Type: application/json"             --data @/tmp/body.json             "$BASE/v1/qa/phone/commands")"
          echo "$queued"
          command_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["command_id"])' <<<"$queued")"
          test -n "$command_id"
          for i in $(seq 1 150); do
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "X-GitHub-Run-ID: ${GITHUB_RUN_ID}"               "$BASE/v1/qa/phone/commands/$command_id")"
            echo "$state" > /tmp/state.json
            status="$(python3 -c 'import json; print(json.load(open("/tmp/state.json"))["command"]["status"])')"
            echo "poll=$i status=$status"
            if [ "$status" = "completed" ] || [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then break; fi
            sleep 2
          done
          cat /tmp/state.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/state.json'))['command']
          assert d['status']=='completed', d
          r=d.get('result') or {}
          assert not r.get('error'), r
          assert r.get('completion_verified_by_ucoa') is True, r
          assert str(r.get('final_foreground','')).endswith('com.android.settings'), r
          assert int(r.get('steps',0) or 0) > 0, r
          print('REAL_PHONE_ACCEPTANCE_PASS')
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-github-token-real-phone-proof
          path: |
            /tmp/state.json
            /tmp/devices.json
            /tmp/health.json
          retention-days: 30
