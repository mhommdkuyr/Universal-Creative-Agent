name: UCOA GitHub Token Phone Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Find the Render service currently receiving the phone heartbeat
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "https://ucoa-agent-brain-69bo.onrender.com"
            "https://ucoa-agent-brain.onrender.com"
          )
          selected=""
          for base in "${candidates[@]}"; do
            echo "Checking service $base"
            health_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 8 "$base/health" || true)"
            echo "health_http=$health_code"
            if [ "$health_code" != "200" ]; then
              continue
            fi
            config_code="$(curl -sS -o /tmp/config.json -w '%{http_code}' --max-time 8 "$base/v1/client/config" || true)"
            echo "config_http=$config_code"
            devices_code="$(curl -sS -o /tmp/devices.json -w '%{http_code}' --max-time 8               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "X-GitHub-Run-ID: ${GITHUB_RUN_ID}"               "$base/v1/qa/phone/devices" || true)"
            echo "devices_http=$devices_code"
            if [ "$devices_code" = "200" ]; then
              count="$(python3 -c 'import json; print(len(json.load(open("/tmp/devices.json")).get("devices") or []))')"
              echo "active_device_count=$count"
              if [ "$count" -gt 0 ]; then
                selected="$base"
                break
              fi
            else
              echo "device_discovery_body:"
              cat /tmp/devices.json || true
            fi
          done
          if [ -z "$selected" ]; then
            echo "No candidate service exposed an authorized active phone session."
            echo "The result distinguishes service/auth errors from an empty heartbeat list."
            exit 1
          fi
          echo "BASE=$selected" >> "$GITHUB_ENV"
          echo "Selected the service reporting an active phone session."

      - name: Execute safe Settings task on active phone
        shell: bash
        run: |
          set -euo pipefail
          task='اختبار قبول حي: افتح تطبيق الإعدادات فقط. لا تغيّر أي إعداد. يجب أن يثبت UCOA من Accessibility UI tree ولقطة الشاشة أن شاشة الإعدادات ظاهرة.'
          python3 - "$task" > /tmp/body.json <<'PY'
          import json,sys
          print(json.dumps({
            "kind":"task",
            "task":sys.argv[1],
            "attachments":[],
            "metadata":{
              "qa_suite":"github-token-live-phone-acceptance",
              "evidence_required":True,
              "no_external_success":True
            }
          },ensure_ascii=False))
          PY
          queued="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H "X-GitHub-Run-ID: ${GITHUB_RUN_ID}"             -H "Content-Type: application/json"             --data @/tmp/body.json             "$BASE/v1/qa/phone/commands")"
          echo "$queued"
          command_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["command_id"])' <<<"$queued")"
          test -n "$command_id"
          for i in $(seq 1 150); do
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "X-GitHub-Run-ID: ${GITHUB_RUN_ID}"               "$BASE/v1/qa/phone/commands/$command_id")"
            echo "$state" > /tmp/state.json
            status="$(python3 -c 'import json; print(json.load(open("/tmp/state.json"))["command"]["status"])')"
            echo "poll=$i status=$status"
            if [ "$status" = "completed" ] || [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then break; fi
            sleep 2
          done
          cat /tmp/state.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/state.json'))['command']
          assert d['status']=='completed', d
          r=d.get('result') or {}
          assert not r.get('error'), r
          assert r.get('completion_verified_by_ucoa') is True, r
          assert str(r.get('final_foreground','')).endswith('com.android.settings'), r
          assert int(r.get('steps',0) or 0) > 0, r
          print('REAL_PHONE_ACCEPTANCE_PASS')
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-github-token-real-phone-proof
          path: |
            /tmp/state.json
            /tmp/devices.json
            /tmp/health.json
            /tmp/config.json
          if-no-files-found: warn
          retention-days: 30
