name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install pytest pillow numpy opencv-python-headless -r server/requirements.txt
      - run: PYTHONPATH=. pytest -q

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Validate APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT_PATH"
          "$AAPT_PATH" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: ucoa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  package-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile server modules
        run: python -m compileall -q server
      - name: Verify no secrets are committed
        run: |
          ! grep -R --exclude-dir=.git -E 'AIza[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z]+|csk-[0-9A-Za-z-]+|sk-[0-9A-Za-z]{20,}' .
