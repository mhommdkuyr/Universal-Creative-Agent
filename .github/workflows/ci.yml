name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install pytest pillow numpy opencv-python-headless -r server/requirements.txt
      - run: PYTHONPATH=. pytest -q

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Production cloud contract
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://ucoa-agent-brain.onrender.com/health
          curl -fsS --max-time 20 https://ucoa-agent-brain.onrender.com/v1/client/config -o /tmp/client-config.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/client-config.json'))
          assert d.get('ok') is True, d
          assert d.get('features',{}).get('remote_config') is True, d
          assert d.get('features',{}).get('server_side_hotfix') is True, d
          print('cloud config OK:', d.get('revision'))
          PY
      - name: Build thin cloud-client APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Validate thin cloud-client APK
        run: |
          set -eu
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c '%s' "$APK")
          echo "APK_BYTES=$SIZE"
          test "$SIZE" -lt 41943040
          ! unzip -l "$APK" | grep -E 'ucoa_local_model|litertlm'
          AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT_PATH"
          "$AAPT_PATH" dump badging "$APK" | head -n 20
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          test -e /dev/kvm
      - name: Final emulator cloud smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            test -s android/app/build/outputs/apk/debug/app-debug.apk
            UCOA_APK_PATH="$PWD/android/app/build/outputs/apk/debug/app-debug.apk" CAPCUT_OPTIONAL=true CAPCUT_APK_PATH="$PWD/.cache/capcut/capcut.apk" bash ./server/ci_capcut_e2e.sh
      - name: Upload final verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-final-verified-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Upload build APK as diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

  docker-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible backend image
        run: docker build -f server/Dockerfile server

  package-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile server modules
        run: python -m compileall -q server
      - name: Verify no secrets are committed
        run: |
          ! grep -R --exclude-dir=.git -E 'AIza[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z]+|csk-[0-9A-Za-z-]+|sk-[0-9A-Za-z]{20,}' .
