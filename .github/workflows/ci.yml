name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install pytest pillow numpy opencv-python-headless -r server/requirements.txt
      - run: PYTHONPATH=. pytest -q

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build thin cloud-client APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Validate thin cloud-client APK
        run: |
          set -eu
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c '%s' "$APK")
          echo "APK_BYTES=$SIZE"
          test "$SIZE" -lt 41943040
          ! unzip -l "$APK" | grep -E 'ucoa_local_model|litertlm'
          AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT_PATH"
          "$AAPT_PATH" dump badging "$APK" | head -n 20
      - name: Upload CI APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-ci-apk-diagnostic
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
