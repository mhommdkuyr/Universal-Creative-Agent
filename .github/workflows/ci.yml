name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pillow numpy opencv-python-headless
      - run: pytest -q
  android-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f android/settings.gradle
      - run: test -f android/app/src/main/AndroidManifest.xml
