name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install pytest pillow numpy opencv-python-headless -r server/requirements.txt
      - run: PYTHONPATH=. pytest -q

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build thin cloud-client APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Validate thin cloud-client APK
        run: |
          set -eu
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c '%s' "$APK")
          echo "APK_BYTES=$SIZE"
          test "$SIZE" -lt 41943040
          ! unzip -l "$APK" | grep -E 'ucoa_local_model|litertlm'
          AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT_PATH"
          "$AAPT_PATH" dump badging "$APK" | head -n 20
      - name: Upload CI APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-ci-apk-diagnostic
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  real-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      BASE: https://ucoa-agent-brain.onrender.com
    steps:
      - name: Wait for production bridge
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 5 "$BASE/health" || true)
            echo "health=$code attempt=$i"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then cat /tmp/health.json; break; fi
            sleep 2
          done
          test -s /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
      - name: Discover connected physical phone
        run: |
          set -euo pipefail
          get_oidc_token() {
            curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ucoa-live-phone" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          for i in $(seq 1 60); do
            token="$(get_oidc_token)"
            code="$(curl -sS -o /tmp/devices.json -w '%{http_code}' -H "Authorization: Bearer $token" "$BASE/v1/qa/phone/devices" || true)"
            echo "devices=$code attempt=$i"
            if [ "$code" = "200" ]; then
              cat /tmp/devices.json
              count="$(python3 -c 'import json; print(len(json.load(open("/tmp/devices.json")).get("devices") or []))')"
              if [ "$count" -gt 0 ]; then exit 0; fi
            fi
            sleep 2
          done
          exit 1
      - name: Execute one Settings command on connected phone
        run: |
          set -euo pipefail
          get_oidc_token() {
            curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ucoa-live-phone" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          body="$(python3 - <<'PY'
import json
print(json.dumps({"kind":"task","task":"اختبار القبول: افتح تطبيق الإعدادات فقط. لا تغيّر أي إعداد. يجب إثبات النتيجة من UCOA عبر Accessibility UI tree ولقطة الشاشة. بقاء ChatGPT أو فتح متصفح ليس نجاحًا.","attachments":[],"metadata":{"qa_suite":"ci-real-phone","evidence_required":True,"no_external_success":True}},ensure_ascii=False))
PY
)"
          token="$(get_oidc_token)"
          queued="$(curl --fail --silent --show-error -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$body" "$BASE/v1/qa/phone/commands")"
          echo "$queued"
          command_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["command_id"])' <<<"$queued")"
          for i in $(seq 1 120); do
            token="$(get_oidc_token)"
            curl --fail --silent --show-error -H "Authorization: Bearer $token" "$BASE/v1/qa/phone/commands/$command_id" > /tmp/phone-state.json
            status="$(python3 -c 'import json; print(json.load(open("/tmp/phone-state.json"))["command"]["status"])')"
            echo "poll=$i status=$status"
            if [ "$status" = "completed" ] || [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then break; fi
            sleep 2
          done
          cat /tmp/phone-state.json
          python3 - <<'PY'
import json
d=json.load(open('/tmp/phone-state.json'))['command']
assert d['status']=='completed', d
r=d.get('result') or {}
assert not r.get('error'), r
assert r.get('completion_verified_by_ucoa') is True, r
assert r.get('final_foreground') == 'com.android.settings', r
assert int(r.get('steps',0) or 0) > 0, r
print('REAL_PHONE_ACCEPTANCE_PASS')
PY
      - name: Upload phone proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-real-phone-proof
          path: /tmp/phone-state.json
          if-no-files-found: ignore
