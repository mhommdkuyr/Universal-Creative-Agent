name: Final APK Release Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["smoke"]
    types: [completed]

concurrency:
  group: final-apk-release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  cloud-contract:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke dependencies
        run: python -m pip install --disable-pip-version-check pillow
      - name: Production health
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 5 https://ucoa-agent-brain.onrender.com/health || true)
            echo "health HTTP=$code"
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Live agent contract
        run: |
          set -euo pipefail
          python server/ci_render_v3_smoke.py plan
          python server/ci_render_v3_smoke.py step
          python server/ci_render_v3_smoke.py state
      - name: Remote config contract
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://ucoa-agent-brain.onrender.com/v1/client/config -o /tmp/client-config.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/client-config.json'))
          assert d.get('ok') is True, d
          assert d.get('features',{}).get('remote_config') is True, d
          assert d.get('features',{}).get('server_side_hotfix') is True, d
          print('remote config revision:', d.get('revision'))
          PY

  emulator-release:
    needs: cloud-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: gradle -p android assembleDebug --stacktrace
      - name: Validate thin APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c '%s' "$APK")
          echo "APK_BYTES=$SIZE"
          test "$SIZE" -lt 41943040
          ! unzip -l "$APK" | grep -E 'ucoa_local_model|litertlm'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          test -e /dev/kvm
      - name: Final emulator + cloud + accessibility + verification smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            test -s android/app/build/outputs/apk/debug/app-debug.apk
            UCOA_APK_PATH="$PWD/android/app/build/outputs/apk/debug/app-debug.apk" CAPCUT_OPTIONAL=true CAPCUT_APK_PATH="$PWD/.cache/capcut/capcut.apk" bash ./server/ci_capcut_e2e.sh
      - name: Final APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-final-verified-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
