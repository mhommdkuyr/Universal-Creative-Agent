name: Firebase Test Lab Android Real Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'server/**'
      - '.github/workflows/firebase-testlab-android-real.yml'

concurrency:
  group: firebase-testlab-${{ github.sha }}
  cancel-in-progress: true

jobs:
  firebase-real-device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK and instrumentation test APK
        run: |
          set -euo pipefail
          gradle -p android assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify cloud-only APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$APK"
          test -s "$TEST_APK"
          test "$(stat -c '%s' "$APK")" -lt 41943040
          ! unzip -l "$APK" | grep -Ei 'ucoa_local_model|\.litertlm'
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee ucoa_apk_sha256.txt
          stat -c 'APK_BYTES=%s' "$APK" | tee -a ucoa_apk_sha256.txt
          echo "COMMIT_SHA=$GITHUB_SHA" | tee -a ucoa_apk_sha256.txt

      - name: Authenticate to Google Cloud with Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Discover an available physical Android device
        id: device
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android models list --format=json > /tmp/ftl-models.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('/tmp/ftl-models.json'))
          models=data.get('models', data) if isinstance(data, dict) else data
          candidates=[]
          for m in models:
              if str(m.get('form','')).upper() != 'PHYSICAL':
                  continue
              mid=m.get('id') or m.get('modelId')
              versions=m.get('versionIds') or m.get('supportedVersionIds') or []
              versions=[str(v) for v in versions]
              if not mid or not versions:
                  continue
              preferred=next((v for v in ('35','34','33','32') if v in versions), None)
              if preferred is None:
                  numeric=[v for v in versions if v.isdigit()]
                  preferred=max(numeric, key=int) if numeric else versions[0]
              candidates.append((str(mid), preferred))
          if not candidates:
              raise SystemExit('No physical Firebase Test Lab Android device with supported Android versions was returned')
          candidates.sort(key=lambda c: (int(c[1]) if c[1].isdigit() else 0, str(c[0])), reverse=True)
          mid, version = candidates[0]
          print(f'MODEL={mid}')
          print(f'VERSION={version}')
          PY
          cat /tmp/ftl-models.json >/dev/null

      - name: Discover results storage bucket
        id: bucket
        shell: bash
        env:
          CONFIGURED_RESULTS_BUCKET: ${{ secrets.FIREBASE_TEST_RESULTS_BUCKET || secrets.RESULTS_BUCKET || '' }}
        run: |
          set -euo pipefail
          PROJECT_ID="$(python3 - <<'PY'
          import json, os
          path=os.environ['GOOGLE_GHA_CREDS_PATH']
          print(json.load(open(path))['project_id'])
          PY
          )"

          normalize_bucket() {
            local value="$1"
            if [ -n "$value" ] && [[ "$value" != gs://* ]]; then
              value="gs://$value"
            fi
            printf '%s' "$value"
          }

          BUCKET="$(normalize_bucket "$CONFIGURED_RESULTS_BUCKET")"

          if [ -z "$BUCKET" ]; then
            BUCKET="$(PROJECT_ID="$PROJECT_ID" python3 - <<'PY'
          import subprocess, json, sys, os
          project_id = os.environ.get('PROJECT_ID', '')
          try:
              res = subprocess.run(['gcloud', 'storage', 'buckets', 'list', f'--project={project_id}', '--format=json'], capture_output=True, text=True)
              if res.returncode == 0 and res.stdout.strip():
                  data = json.loads(res.stdout)
                  names = [b.get('name') for b in data if isinstance(b, dict) and b.get('name')]
                  if names:
                      print(names[0])
                      sys.exit(0)
          except Exception:
              pass
          print('')
          PY
            )"
            BUCKET="$(normalize_bucket "$BUCKET")"
          fi

          # Custom bucket is optional. Without it, Firebase Test Lab uses the project's default results bucket.
          echo "BUCKET=$BUCKET" >> "$GITHUB_OUTPUT"
          if [ -n "$BUCKET" ]; then
            echo "Using configured/discovered custom results bucket: $BUCKET"
          else
            echo "No custom bucket; Firebase Test Lab will use its default results bucket."
          fi

      - name: Verify results bucket access
        env:
          RESULTS_BUCKET: ${{ steps.bucket.outputs.BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$RESULTS_BUCKET" ]; then
            echo "No custom bucket configured; skipping custom-bucket access probe."
            exit 0
          fi
          echo "Checking Firebase Test Lab results bucket: $RESULTS_BUCKET"
          gcloud storage ls "$RESULTS_BUCKET"
          PROBE="/tmp/ucoa-results-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf "ucoa-results-probe\n" > "$PROBE"
          PROBE_OBJECT="${RESULTS_BUCKET%/}/ucoa-ci-probes/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          gcloud storage cp "$PROBE" "$PROBE_OBJECT"
          gcloud storage rm "$PROBE_OBJECT"
          echo "RESULTS_BUCKET_WRITE_OK=$RESULTS_BUCKET" >> "$GITHUB_ENV"          set -euo pipefail
          test -n "$RESULTS_BUCKET"
          echo "Checking Firebase Test Lab results bucket: $RESULTS_BUCKET"
          gcloud storage ls "$RESULTS_BUCKET"
          PROBE="/tmp/ucoa-results-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'ucoa-results-probe\n' > "$PROBE"
          PROBE_OBJECT="${RESULTS_BUCKET%/}/ucoa-ci-probes/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          gcloud storage cp "$PROBE" "$PROBE_OBJECT"
          gcloud storage rm "$PROBE_OBJECT"
          echo "RESULTS_BUCKET_WRITE_OK=$RESULTS_BUCKET" >> "$GITHUB_ENV"

      - name: Run real execution on Firebase Test Lab physical device
        id: ftl
        env:
          APK: android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          MODEL: ${{ steps.device.outputs.MODEL }}
          VERSION: ${{ steps.device.outputs.VERSION }}
          RESULTS_BUCKET: ${{ steps.bucket.outputs.BUCKET }}
        run: |
          set -euo pipefail
          PROJECT_ID="$(python3 - <<'PY'
          import json, os
          path=os.environ['GOOGLE_GHA_CREDS_PATH']
          print(json.load(open(path))['project_id'])
          PY
          )"
          test -n "$PROJECT_ID"
          echo "Firebase project: $PROJECT_ID"
          echo "Firebase physical device: $MODEL / Android $VERSION"

          EXTRA_ARGS=()
          if [ -n "$RESULTS_BUCKET" ]; then
            EXTRA_ARGS=("--results-bucket=$RESULTS_BUCKET")
            EXTRA_ARGS+=("--results-dir=ucoa/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          fi

          set +e
          gcloud firebase test android run \
            --project="$PROJECT_ID" \
            --type=instrumentation \
            --app="$APK" \
            --test="$TEST_APK" \
            --device model="$MODEL",version="$VERSION",locale=en,orientation=portrait \
            --timeout 15m \
            --num-flaky-test-attempts 0 \
            "${EXTRA_ARGS[@]}" \
            --environment-variables "UCOA_SMOKE_TASK=افتح الإعدادات" \
            --format=json > ftl-result.json 2> ftl-stderr.log
          EXIT_CODE=$?
          set -e
          cat ftl-result.json || true
          cat ftl-stderr.log || true
          echo "GCLOUD_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

      - name: Validate Firebase Test Matrix and extract evidence
        env:
          MODEL: ${{ steps.device.outputs.MODEL }}
          VERSION: ${{ steps.device.outputs.VERSION }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, os

          result_file = 'ftl-result.json'
          stderr_file = 'ftl-stderr.log'

          stderr_text = open(stderr_file).read() if os.path.exists(stderr_file) else ''

          if "TEST_QUOTA_EXCEEDED" in stderr_text.upper() or "QUOTA" in stderr_text.upper():
              sys.exit("BLOCKER: TEST_QUOTA_EXCEEDED encountered during physical test execution")

          if "STORAGE.OBJECTS.CREATE" in stderr_text.upper() or "PERMISSION 'STORAGE.OBJECTS.CREATE' DENIED" in stderr_text.upper():
              sys.exit(f"BLOCKER: Storage permissions error during test upload:\n{stderr_text}")

          if not os.path.exists(result_file) or os.path.getsize(result_file) == 0:
              sys.exit(f"ERROR: gcloud run failed without JSON output:\n{stderr_text}")

          try:
              data = json.load(open(result_file))
          except Exception as e:
              sys.exit(f"ERROR: Could not parse ftl-result.json: {e}\nStderr:\n{stderr_text}")

          matrix_id = data.get('testMatrixId') or data.get('matrixId') or 'unknown'
          state = data.get('state') or 'UNKNOWN'
          outcome = data.get('outcomeSummary') or 'UNKNOWN'

          print("================ PHYSICAL ACCEPTANCE RESULTS ================")
          print(f"Matrix ID: {matrix_id}")
          print(f"State: {state}")
          print(f"Outcome Summary: {outcome}")
          print(f"Physical Device Model: {os.environ.get('MODEL')}")
          print(f"Android Version: {os.environ.get('VERSION')}")
          print("=========================================================")

          if outcome != 'SUCCESS':
              sys.exit(f"FAILED: Firebase Test Lab physical acceptance failed with outcome: {outcome}")

          print("Physical acceptance test matrix PASSED successfully!")
          PY

      - name: Upload Firebase Test Lab result and APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-firebase-real-device-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            ucoa_apk_sha256.txt
            ftl-result.json
          if-no-files-found: ignore
          retention-days: 14
