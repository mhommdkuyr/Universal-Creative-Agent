name: Render Brain Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/render-brain-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRAIN_URL: https://ucoa-agent-brain-local2.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Wait for public health
        run: |
          set -e
          for i in $(seq 1 60); do
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 15 "$BRAIN_URL/health" || true)
            cat health.json || true
            echo "HTTP $code"
            if [ "$code" = "200" ] && grep -q '"ok":true' health.json && grep -q '"brain_configured":true' health.json; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Run text planning inference
        run: |
          set -e
          cat > plan.json <<'JSON'
          {"task":"ضع خطة قصيرة لإكمال مهمة على الهاتف: افتح التطبيق المناسب، نفذ المطلوب، وتحقق من النتيجة.","attachments":[],"device":{"android":35}}
          JSON
          curl -fS --max-time 300 -X POST "$BRAIN_URL/v1/agent/plan" -H 'Content-Type: application/json' --data-binary @plan.json -o result.json
          cat result.json
          python - <<'PY'
          import json
          x=json.load(open('result.json'))
          assert isinstance(x.get('summary'), str) and x['summary'].strip()
          assert isinstance(x.get('steps'), list) and len(x['steps']) >= 2
          print('PLAN_INFERENCE_OK')
          PY
      - name: Run vision action inference
        run: |
          set -e
          python -m pip install -q pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          import base64, io, json, os, urllib.request
          img=Image.new('RGB',(480,320),'white')
          d=ImageDraw.Draw(img)
          d.text((40,50),'Universal Creative Agent',fill='black')
          d.rectangle((40,130,220,210),outline='black',width=3)
          d.text((78,160),'Continue',fill='black')
          buf=io.BytesIO(); img.save(buf,format='JPEG',quality=75)
          payload={
            'task':'على الشاشة زر Continue. اختر الفعل الذي ينفذ الضغط على الزر.',
            'step':0,'max_steps':10,'history':[],'ui_tree':'[]',
            'screenshot_base64':base64.b64encode(buf.getvalue()).decode(),
            'installed_apps':[],'capabilities':['tap','click_any_text','observe','done']
          }
          req=urllib.request.Request(os.environ['BRAIN_URL']+'/v1/agent/step',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=300) as r:
              x=json.loads(r.read().decode())
          print(json.dumps(x,ensure_ascii=False))
          assert x.get('action') in {'tap','click_any_text','observe','done'}
          print('VISION_INFERENCE_OK')
          PY
