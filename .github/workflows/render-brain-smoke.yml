name: Render Brain Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/render-brain-smoke.yml'

# Stable async-job smoke test for the currently deployed local brain.
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BRAIN_URL: https://ucoa-agent-brain-local2.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Wait for public health and correct local model
        run: |
          set -e
          for i in $(seq 1 40); do
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 10 "$BRAIN_URL/health" || true)
            cat health.json || true
            if [ "$code" = "200" ] && grep -q '"ok":true' health.json && grep -q '"brain_configured":true' health.json && grep -q 'Qwen2.5-0.5B-Instruct-Q2_K' health.json; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Submit and poll local text planning job
        run: |
          set -e
          printf '%s' '{"task":"Create a 2-step plan: open the appropriate Android app, do the requested action, then verify the result.","attachments":[],"device":{"android":35}}' > plan.json
          curl -fS --max-time 15 -X POST "$BRAIN_URL/v1/agent/plan" -H 'Content-Type: application/json' --data-binary @plan.json -o job.json
          cat job.json
          job_id=$(python -c 'import json; print(json.load(open("job.json"))["job_id"])')
          for i in $(seq 1 90); do
            curl -fS --max-time 10 "$BRAIN_URL/v1/agent/jobs/$job_id" -o result.json
            status=$(python -c 'import json; print(json.load(open("result.json")).get("status",""))')
            echo "status=$status"
            if [ "$status" = "completed" ]; then
              cat result.json
              python - <<'PY'
import json
x=json.load(open('result.json'))['result']
assert x.get('summary')
assert isinstance(x.get('steps'), list) and len(x['steps']) >= 2
print('PLAN_INFERENCE_OK')
PY
              exit 0
            fi
            if [ "$status" = "failed" ]; then cat result.json; exit 1; fi
            sleep 2
          done
          exit 1
      - name: Submit and poll local action decision job
        run: |
          set -e
          cat > step.json <<'JSON'
          {"task":"The screen contains a Continue button. Press it.","step":0,"max_steps":5,"history":[],"ui_tree":"[{\"text\":\"Continue\",\"class\":\"android.widget.Button\"}]","installed_apps":["Chrome","Canva","CapCut"],"attachments":[],"capabilities":["tap","click_any_text","observe","done"]}
          JSON
          curl -fS --max-time 15 -X POST "$BRAIN_URL/v1/agent/step" -H 'Content-Type: application/json' --data-binary @step.json -o job.json
          job_id=$(python -c 'import json; print(json.load(open("job.json"))["job_id"])')
          for i in $(seq 1 90); do
            curl -fS --max-time 10 "$BRAIN_URL/v1/agent/jobs/$job_id" -o result.json
            status=$(python -c 'import json; print(json.load(open("result.json")).get("status",""))')
            echo "status=$status"
            if [ "$status" = "completed" ]; then
              cat result.json
              python - <<'PY'
import json
x=json.load(open('result.json'))['result']
assert x.get('action') in {'tap','click_any_text','observe','done'}
print('ACTION_INFERENCE_OK')
PY
              exit 0
            fi
            if [ "$status" = "failed" ]; then cat result.json; exit 1; fi
            sleep 2
          done
          exit 1
