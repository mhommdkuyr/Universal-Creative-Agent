name: Render Brain Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'conftest.py'
      - '.github/workflows/render-brain-smoke.yml'
  schedule:
    - cron: '31 */6 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: render-brain-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BRAIN_URL: https://ucoa-agent-brain.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke dependencies
        run: python -m pip install --disable-pip-version-check --no-input pillow
      - name: Wait for production health
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 5 "$BRAIN_URL/health" || true)
            echo "health HTTP $code"
            cat health.json || true
            if [ "$code" = "200" ] && grep -q '"ok":true' health.json; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify provider models contract
        run: |
          set -euo pipefail
          code=$(curl -sS -o models.json -w '%{http_code}' --max-time 30 "$BRAIN_URL/v1/providers/models")
          cat models.json
          test "$code" = "200"
          python - <<'PY'
          import json
          x=json.load(open('models.json'))
          assert x.get('object') == 'list'
          assert isinstance(x.get('data'), list)
          assert all({'provider','model','vision','configured','base_url'} <= set(item) for item in x['data'])
          configured=[item for item in x['data'] if item.get('configured')]
          assert configured, 'No configured cloud provider is exposed by the production router'
          print(f"provider models contract passed: {len(configured)} configured providers")
          PY
      - name: Verify installed-client step endpoint is registered
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/step.txt -w '%{http_code}' --max-time 15 "$BRAIN_URL/v1/agent/step" || true)
          cat /tmp/step.txt || true
          test "$code" = "405"
          echo "Android step endpoint registration passed"
      - name: Run real-device Settings acceptance
        shell: bash
        run: |
          set -euo pipefail
          BASE="$BRAIN_URL"

          get_oidc_token() {
            curl --fail --silent --show-error               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ucoa-live-phone" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }

          task='اختبار قبول حي حقيقي: افتح تطبيق الإعدادات فقط. لا تغيّر أي إعداد. أثبت من UCOA نفسه عبر Accessibility UI tree ولقطة الشاشة أن شاشة الإعدادات ظاهرة. فتح متصفح أو بقاء ChatGPT لا يعتبر نجاحًا.'
          body="$(python3 - "$task" <<'PY'
import json,sys
print(json.dumps({
  "kind":"task",
  "task":sys.argv[1],
  "attachments":[],
  "metadata":{
    "qa_suite":"render-brain-smoke-live-phone",
    "test_suite":"real_device_live_ui_v9",
    "evidence_required":True,
    "no_external_success":True
  }
},ensure_ascii=False))
PY
)"

          for attempt in $(seq 1 90); do
            token="$(get_oidc_token)"
            devices_code="$(curl -sS -o /tmp/devices.json -w '%{http_code}'               -H "Authorization: Bearer ${token}"               "$BASE/v1/qa/phone/devices" || true)"
            echo "device discovery attempt=$attempt http=$devices_code"
            if [ "$devices_code" = "200" ]; then
              cat /tmp/devices.json
              count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("devices") or []))' < /tmp/devices.json)"
              if [ "$count" -gt 0 ]; then
                break
              fi
            fi
            sleep 3
          done
          test -s /tmp/devices.json
          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("devices") or []))' < /tmp/devices.json)"
          test "$count" -gt 0

          token="$(get_oidc_token)"
          queued="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${token}"             -H "Content-Type: application/json"             -d "$body"             "$BASE/v1/qa/phone/commands")"
          echo "$queued"

          command_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["command_id"])' <<<"$queued")"
          target_install_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["install_id"])' <<<"$queued")"
          test -n "$command_id"
          test -n "$target_install_id"
          echo "QA target install_id=$target_install_id"

          for attempt in $(seq 1 120); do
            token="$(get_oidc_token)"
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer ${token}"               "$BASE/v1/qa/phone/commands/$command_id")"
            echo "$state" > /tmp/live-phone-state.json
            status="$(python3 -c 'import json; print(json.load(open("/tmp/live-phone-state.json"))["command"]["status"])')"
            echo "poll=$attempt status=$status"
            if [ "$status" = "completed" ] || [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then
              break
            fi
            sleep 2
          done

          cat /tmp/live-phone-state.json
          python3 - "$target_install_id" <<'PY'
import json,sys
expected_install_id=sys.argv[1]
d=json.load(open("/tmp/live-phone-state.json"))["command"]
if d["status"] != "completed":
    raise SystemExit(f"device command status={d['status']}")
if d.get("install_id") != expected_install_id:
    raise SystemExit("install_id changed during execution")
r=d.get("result") or {}
if r.get("error"):
    raise SystemExit(f"device result error={r['error']}")
if r.get("completion_verified_by_ucoa") is not True:
    raise SystemExit("UCOA did not provide final execution verification")
if r.get("final_foreground") != "com.android.settings":
    raise SystemExit(f"wrong final foreground: {r.get('final_foreground')}")
if int(r.get("steps",0) or 0) <= 0:
    raise SystemExit("no execution steps recorded")
print("REAL_DEVICE_ACCEPTANCE_PASS")
PY

      - name: Probe a live cloud provider
        run: |
          set -euo pipefail
          curl -sS --fail --max-time 60 "$BRAIN_URL/v1/providers/probe" | tee /tmp/providers.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/providers.json'))
          ok=[p for p in data.get('providers',[]) if p.get('ok')]
          assert ok, 'No configured cloud provider returned a successful live probe'
          for p in data.get('providers',[]):
              print(p.get('provider'), p.get('model'), p.get('vision'), p.get('ok'), p.get('latency_s'), p.get('error',''))
          runtime=data.get('runtime',{})
          assert runtime.get('ok') is True, runtime
          PY
      - name: Run state and verifier smoke
        run: |
          set -euo pipefail
          BRAIN_URL="$BRAIN_URL" python server/ci_render_v3_smoke.py state
      - name: Run planner smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          BRAIN_URL="$BRAIN_URL" python server/ci_render_v3_smoke.py plan
      - name: Run Android control step smoke
        run: |
          set -euo pipefail
          BRAIN_URL="$BRAIN_URL" python server/ci_render_v3_smoke.py step
