name: Render Brain Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/render-brain-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRAIN_URL: https://ucoa-agent-brain-local2.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Wait for public health and correct local model
        run: |
          set -e
          for i in $(seq 1 60); do
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 15 "$BRAIN_URL/health" || true)
            cat health.json || true
            if [ "$code" = "200" ] && grep -q '"ok":true' health.json && grep -q '"brain_configured":true' health.json && grep -q 'SmolLM2-135M-Instruct-Q4_K_M' health.json; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Run local text planning inference
        run: |
          set -e
          printf '%s' '{"task":"Create a 2-step plan: open the appropriate Android app, do the requested action, then verify the result.","attachments":[],"device":{"android":35}}' > plan.json
          curl -fS --max-time 120 -X POST "$BRAIN_URL/v1/agent/plan" -H 'Content-Type: application/json' --data-binary @plan.json -o result.json
          cat result.json
          python - <<'PY'
          import json
          x=json.load(open('result.json'))
          assert x.get('summary')
          assert isinstance(x.get('steps'), list) and len(x['steps']) >= 2
          print('PLAN_INFERENCE_OK')
          PY
      - name: Run local generic action inference
        run: |
          set -e
          python - <<'PY'
          import json, os, urllib.request
          payload={'task':'The screen contains a Continue button. Press it.','step':0,'max_steps':5,'history':[],'ui_tree':'[{"text":"Continue","class":"android.widget.Button"}]','installed_apps':['Chrome','Canva','CapCut'],'attachments':[],'capabilities':['tap','click_any_text','observe','done']}
          req=urllib.request.Request(os.environ['BRAIN_URL']+'/v1/agent/step',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as r: x=json.loads(r.read().decode())
          print(json.dumps(x,ensure_ascii=False))
          assert x.get('action') in {'tap','click_any_text','observe','done'}
          print('ACTION_INFERENCE_OK')
          PY
