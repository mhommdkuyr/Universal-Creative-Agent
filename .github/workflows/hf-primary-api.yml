name: HF Primary API Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/ci_hf_primary_api.py'
      - '.github/workflows/hf-primary-api.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'gradio_client>=1.13,<2' 'pillow>=11,<13'
      - run: python server/ci_hf_primary_api.py
