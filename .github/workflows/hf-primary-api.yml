name: HF Primary API Probe
on:
  workflow_dispatch:
  schedule:
    - cron: '07 */12 * * *'

concurrency:
  group: hf-primary-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'gradio_client>=1.13,<3' 'pillow>=11,<13'
      - run: python server/ci_hf_primary_api.py
