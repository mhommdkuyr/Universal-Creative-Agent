# Production acceptance run: this workflow intentionally exercises the live V4 brain.
name: Vision Integration

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/vision-integration.yml'
  workflow_dispatch:

jobs:
  huggingface-vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow "gradio_client>=1.13,<2"
      - run: python server/ci_hf_vision_smoke.py
        continue-on-error: true

  render-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Wait for production brain
        env:
          BRAIN_URL: https://ucoa-agent-brain.onrender.com
        run: |
          set -e
          for i in $(seq 1 60); do
            body=$(curl -fsS --max-time 10 "$BRAIN_URL/health" || true)
            echo "$body"
            if echo "$body" | grep -q '\"ok\":true'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify plan job
        env:
          BRAIN_URL: https://ucoa-agent-brain.onrender.com
        run: python server/ci_render_v3_smoke.py plan
      - name: Verify multimodal action job
        env:
          BRAIN_URL: https://ucoa-agent-brain.onrender.com
        run: python server/ci_render_v3_smoke.py step
      - name: Verify persisted state and result verifier
        env:
          BRAIN_URL: https://ucoa-agent-brain.onrender.com
        run: python server/ci_render_v3_smoke.py state
