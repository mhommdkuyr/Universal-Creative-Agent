# Production acceptance run: this workflow intentionally exercises live AI providers.
name: Vision Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'

concurrency:
  group: vision-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  huggingface-vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow "gradio_client>=1.13,<2"
      - run: python server/ci_hf_vision_smoke.py

  render-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Wait for production brain
        env:
          BRAIN_URL: https://ucoa-agent-brain.onrender.com
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            body=$(curl -fsS --max-time 5 "$BRAIN_URL/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"ok":true'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify plan job
        env:
          BRAIN_URL: https://ucoa-agent-brain.onrender.com
        run: python server/ci_render_v3_smoke.py plan
      - name: Verify multimodal action job
        env:
          BRAIN_URL: https://ucoa-agent-brain.onrender.com
        run: python server/ci_render_v3_smoke.py step
      - name: Verify persisted state and result verifier
        env:
          BRAIN_URL: https://ucoa-agent-brain.onrender.com
        run: python server/ci_render_v3_smoke.py state
