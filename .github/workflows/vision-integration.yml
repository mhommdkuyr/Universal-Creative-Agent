name: Vision Integration

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/vision-integration.yml'
  workflow_dispatch:

jobs:
  huggingface-vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow "gradio_client>=1.13,<2"
      - run: python server/ci_hf_vision_smoke.py

  render-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Wait for V3 brain
        env:
          BRAIN_URL: https://ucoa-agent-brain-local2.onrender.com
        run: |
          set -e
          for i in $(seq 1 60); do
            body=$(curl -fsS --max-time 10 "$BRAIN_URL/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"version":"3.0.0"' && echo "$body" | grep -q '"local_vision":true'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify plan job
        run: python server/ci_render_v3_smoke.py plan
      - name: Verify VLM-separate action job
        run: python server/ci_render_v3_smoke.py step
      - name: Verify persisted state and result verifier
        run: python server/ci_render_v3_smoke.py state
