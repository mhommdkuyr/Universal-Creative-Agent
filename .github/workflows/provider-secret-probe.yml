name: Provider Secret Live Probe (non-Gemini)

on:
  push:
    paths:
      - ".github/workflows/provider-secret-probe.yml"
      - "server/provider_router.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UCOA_OMNIROUTE_API_KEY: ${{ secrets.UCOA_OMNIROUTE_API_KEY }}
      UCOA_DEEPSEEK_API_KEY: ${{ secrets.UCOA_DEEPSEEK_API_KEY }}
      UCOA_CEREBRAS_API_KEY: ${{ secrets.UCOA_CEREBRAS_API_KEY }}
      UCOA_GROQ_API_KEY: ${{ secrets.UCOA_GROQ_API_KEY }}
      UCOA_OMNIROUTE_BASE_URL: https://ucoa-omniroute-image.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe configured non-Gemini providers
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          providers = []
          if os.getenv("HF_TOKEN"): providers.append(("huggingface", "https://router.huggingface.co/v1", "Qwen/Qwen3-4B-Instruct-2507:fastest"))
          if os.getenv("UCOA_OMNIROUTE_API_KEY"): providers.append(("omniroute", os.getenv("UCOA_OMNIROUTE_BASE_URL",""), "auto"))
          if os.getenv("UCOA_DEEPSEEK_API_KEY"): providers.append(("deepseek", "https://api.deepseek.com", "deepseek-chat"))
          if os.getenv("UCOA_CEREBRAS_API_KEY"): providers.append(("cerebras", "https://api.cerebras.ai/v1", "gpt-oss-120b"))
          if os.getenv("UCOA_GROQ_API_KEY"): providers.append(("groq", "https://api.groq.com/openai/v1", "openai/gpt-oss-120b"))

          print("configured_non_gemini_candidates=", [p[0] for p in providers])
          assert providers, "No non-Gemini provider secrets are configured in this repository"

          def call_text(name, base, model, key):
              url = base.rstrip("/") + ("" if base.endswith("/chat/completions") else "/chat/completions")
              body = {
                  "model": model, "temperature": 0, "max_tokens": 32,
                  "messages": [
                      {"role":"system","content":"Return only the exact JSON requested."},
                      {"role":"user","content":"Return exactly {\\"ok\\":true}."}
                  ]
              }
              headers={"Content-Type":"application/json","Authorization":"Bearer "+key}
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers,method="POST")
              with urllib.request.urlopen(req,timeout=35) as r: return json.loads(r.read().decode())

          image = base64.b64encode(bytes.fromhex(
              "89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c489"
              "0000000d49444154789c6360f8cf00000003000100d2c4a4f70000000049454e44ae426082"
          )).decode()

          def call_vision(name, base, model, key):
              if name == "omniroute":
                  model = "auto"
              elif name == "huggingface":
                  model = os.getenv("HF_VISION_MODEL","Qwen/Qwen3-VL-2B-Instruct:fastest")
              else:
                  return {"skipped":"provider has no configured vision route"}
              url=base.rstrip("/") + "/chat/completions"
              body={
                  "model":model,"temperature":0,"max_tokens":64,
                  "messages":[{"role":"user","content":[
                      {"type":"text","text":"Return exactly JSON {\\"ok\\":true}. Confirm you can inspect this image."},
                      {"type":"image_url","image_url":{"url":"data:image/png;base64,"+image}}
                  ]}]
              }
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={"Content-Type":"application/json","Authorization":"Bearer "+key},method="POST")
              with urllib.request.urlopen(req,timeout=45) as r: return json.loads(r.read().decode())

          successes=[]
          for name,base,model in providers:
              key = os.getenv("HF_TOKEN") if name=="huggingface" else os.getenv("UCOA_"+name.upper()+"_API_KEY")
              try:
                  t0=time.time(); text=call_text(name,base,model,key)
                  ok=bool((text.get("choices") or [{}])[0].get("message",{}).get("content"))
                  print(json.dumps({"provider":name,"text_ok":ok,"latency_s":round(time.time()-t0,2)},ensure_ascii=False))
                  vision=call_vision(name,base,model,key)
                  vok=bool((vision.get("choices") or [{}])[0].get("message",{}).get("content"))
                  print(json.dumps({"provider":name,"vision_ok":vok},ensure_ascii=False))
                  if ok and (vok or name in {"deepseek","cerebras","groq"}): successes.append(name)
              except Exception as exc:
                  print(json.dumps({"provider":name,"ok":False,"error":type(exc).__name__},ensure_ascii=False))

          assert successes, "No non-Gemini provider passed a live inference probe"
          print("NON_GEMINI_PROVIDER_LIVE_PROBE_PASS", successes)
          PY
