name: Production Gemini Probe
on:
  workflow_dispatch:
  push:
    paths: ['server/app.py','server/provider_router.py','.github/workflows/production-vision-probe.yml','server/cloud_runtime.py']

jobs:
  gemini-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.UCOA_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Gemini credentials
        id: gemini_config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; echo "::warning::Gemini API secret is not configured; external probes will be skipped."; fi
      - name: Check Gemini model catalog
        if: steps.gemini_config.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --http1.1 -sS --connect-timeout 10 --max-time 20 -o /tmp/models.json -w '%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            -H "x-goog-api-key: $GEMINI_API_KEY")
          echo "HTTP $code"; cat /tmp/models.json
          test "$code" = "200"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/models.json'))
          names={str(m.get('name','')).split('/')[-1] for m in x.get('models',[])}
          assert 'gemini-3.8-flash' in names, sorted(n for n in names if 'gemini' in n.lower())[:100]
          print('Gemini model catalog contains gemini-3.8-flash')
          PY
      - name: Verify Gemini text API through native endpoint
        if: steps.gemini_config.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            body=$(curl --http1.1 -sS --connect-timeout 10 --max-time 30 \
              "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              --data-binary '{"contents":[{"parts":[{"text":"Return exactly OK."}]}],"generationConfig":{"temperature":0,"maxOutputTokens":16,"thinkingConfig":{"thinkingLevel":"low"}}}' ) || true
            echo "$body"
            if python - <<'PY' "$body"
          import json,sys
          x=json.loads(sys.argv[1])
          assert not x.get('error'), x
          txt=''.join(p.get('text','') for p in x.get('candidates',[{}])[0].get('content',{}).get('parts',[]) if isinstance(p,dict))
          assert 'OK' in txt, x
          print('Gemini native text generation passed')
          PY
            then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
      - name: Verify Gemini vision API through native endpoint
        if: steps.gemini_config.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          img=Image.new('RGB',(160,90),'white'); d=ImageDraw.Draw(img)
          d.rectangle((48,32,112,58),fill='#dddddd',outline='black'); d.text((55,39),'CONTINUE',fill='black')
          img.save('/tmp/continue.jpg',format='JPEG',quality=75,optimize=True)
          PY
          IMAGE_B64="$(base64 -w0 /tmp/continue.jpg)"
          for attempt in 1 2 3; do
            body=$(curl --http1.1 -sS --connect-timeout 10 --max-time 45 \
              "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              --data-binary "{\"contents\":[{\"parts\":[{\"text\":\"Look at the image. Reply with exactly CONTINUE if a button labeled CONTINUE is visible.\"},{\"inline_data\":{\"mime_type\":\"image/jpeg\",\"data\":\"$IMAGE_B64\"}}]}],\"generationConfig\":{\"temperature\":0,\"maxOutputTokens\":64,\"thinkingConfig\":{\"thinkingLevel\":\"low\"}}}" ) || true
            echo "$body"
            if python - <<'PY' "$body"
          import json,sys
          x=json.loads(sys.argv[1])
          assert not x.get('error'), x
          txt=''.join(p.get('text','') for p in x.get('candidates',[{}])[0].get('content',{}).get('parts',[]) if isinstance(p,dict))
          assert 'CONTINUE' in txt, x
          print('Gemini native vision generation passed')
          PY
            then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Verify UCOA runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest pillow numpy opencv-python-headless
          if [[ -f requirements.txt ]]; then python -m pip install -q -r requirements.txt; fi
          if [[ -f server/requirements.txt ]]; then python -m pip install -q -r server/requirements.txt; fi
          PYTHONPATH=. pytest -q
      - name: Release validation marker
        if: steps.gemini_config.outputs.available == 'true'
        run: echo "Gemini catalog + native text + native vision + UCOA runtime contract passed"
      - name: Runtime-only validation marker
        if: steps.gemini_config.outputs.available != 'true'
        run: echo "UCOA runtime contract passed; Gemini external probe skipped because no API secret is configured"
