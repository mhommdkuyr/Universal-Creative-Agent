name: Production Gemini Probe
on:
  workflow_dispatch:
  push:
    paths: ['server/app.py','server/provider_router.py','.github/workflows/production-vision-probe.yml','server/cloud_runtime.py']

jobs:
  gemini-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.UCOA_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Gemini credentials
        id: gemini_config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; echo "::warning::Gemini API secret is not configured; external probes will be skipped."; fi
      - name: Verify Gemini text API through native endpoint
        if: steps.gemini_config.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            body=$(curl -sS --max-time 90 "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -X POST \
              -d '{"contents":[{"parts":[{"text":"Return exactly OK."}]}],"generationConfig":{"temperature":0,"maxOutputTokens":64,"thinkingConfig":{"thinkingLevel":"low"}}}' )
            echo "$body"
            if grep -q 'OK' <<<"$body"; then exit 0; fi
            echo "Gemini native text probe attempt $attempt failed; retrying…"; sleep $((attempt * 5))
          done
          exit 1
      - name: Verify Gemini vision API through native endpoint
        if: steps.gemini_config.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          img=Image.new('RGB',(160,90),'white')
          d=ImageDraw.Draw(img)
          d.rectangle((48,32,112,58),fill='#dddddd',outline='black')
          d.text((55,39),'CONTINUE',fill='black')
          img.save('/tmp/continue.jpg',format='JPEG',quality=75,optimize=True)
          PY
          IMAGE_B64="$(base64 -w0 /tmp/continue.jpg)"
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sS --max-time 120 "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -X POST \
              -d "{\"contents\":[{\"parts\":[{\"text\":\"Look at the image and reply with exactly CONTINUE if the button labeled CONTINUE is visible.\"},{\"inline_data\":{\"mime_type\":\"image/jpeg\",\"data\":\"$IMAGE_B64\"}}]}],\"generationConfig\":{\"temperature\":0,\"maxOutputTokens\":128,\"thinkingConfig\":{\"thinkingLevel\":\"low\"}}}" )
            echo "$body"
            if grep -q 'CONTINUE' <<<"$body"; then exit 0; fi
            if grep -q '429\|RESOURCE_EXHAUSTED' <<<"$body"; then echo "Gemini vision rate limited; backing off."; fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verify UCOA runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest pillow numpy opencv-python-headless
          if [[ -f requirements.txt ]]; then python -m pip install -q -r requirements.txt; fi
          if [[ -f server/requirements.txt ]]; then python -m pip install -q -r server/requirements.txt; fi
          PYTHONPATH=. pytest -q
      - name: Release validation marker
        if: steps.gemini_config.outputs.available == 'true'
        run: echo "Gemini native text + vision + UCOA runtime contract passed"
      - name: Runtime-only validation marker
        if: steps.gemini_config.outputs.available != 'true'
        run: echo "UCOA runtime contract passed; Gemini external probe skipped because no API secret is configured"
