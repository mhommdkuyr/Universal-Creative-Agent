name: Production Gemini Probe
on:
  workflow_dispatch:
  push:
    paths: ['server/app.py','server/provider_router.py','server/sitecustomize.py','.github/workflows/production-vision-probe.yml','server/cloud_runtime.py']

jobs:
  gemini-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.UCOA_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      UCOA_GEMINI_API_KEY: ${{ secrets.UCOA_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      UCOA_GEMINI_API_KEY_2: ${{ secrets.UCOA_GEMINI_API_KEY_2 || secrets.GEMINI_API_KEY_2 }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UCOA_DEEPSEEK_API_KEY: ${{ secrets.UCOA_DEEPSEEK_API_KEY }}
      UCOA_OMNIROUTE_API_KEY: ${{ secrets.UCOA_OMNIROUTE_API_KEY }}
      UCOA_CEREBRAS_API_KEY: ${{ secrets.UCOA_CEREBRAS_API_KEY }}
      UCOA_GROQ_API_KEY: ${{ secrets.UCOA_GROQ_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Gemini credentials
        id: gemini_config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; echo "::warning::Gemini API secret is not configured; direct Gemini checks will be skipped."; fi
      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pillow pytest numpy opencv-python-headless
          python -m pip install -q -r server/requirements.txt
      - name: Check Gemini model catalog
        if: steps.gemini_config.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --http1.1 -sS --connect-timeout 10 --max-time 20 -o /tmp/models.json -w '%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            -H "x-goog-api-key: $GEMINI_API_KEY")
          echo "HTTP $code"; cat /tmp/models.json
          test "$code" = "200"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/models.json'))
          names={str(m.get('name','')).split('/')[-1] for m in x.get('models',[])}
          assert 'gemini-3.8-flash' in names, sorted(n for n in names if 'gemini' in n.lower())[:100]
          print('Gemini model catalog contains gemini-3.8-flash')
          PY
      - name: Verify Gemini text API when quota allows
        id: gemini_text
        if: steps.gemini_config.outputs.available == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          for attempt in 1 2 3; do
            body=$(curl --http1.1 -sS --connect-timeout 10 --max-time 30 \
              "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              --data-binary '{"contents":[{"parts":[{"text":"Return exactly OK."}]}],"generationConfig":{"temperature":0,"maxOutputTokens":16,"thinkingConfig":{"thinkingLevel":"low"}}}' ) || true
            echo "$body"
            if python - <<'PY' "$body"
          import json,sys
          x=json.loads(sys.argv[1])
          assert not x.get('error'), x
          txt=''.join(p.get('text','') for p in x.get('candidates',[{}])[0].get('content',{}).get('parts',[]) if isinstance(p,dict))
          assert 'OK' in txt, x
          print('Gemini native text generation passed')
          PY
            then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
      - name: Verify cloud router failover contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=server python - <<'PY'
          import provider_router as pr
          for state in pr._BREAKERS.values():
              state.failures = 0; state.opened_at = 0.0
          original_ordered = pr._ordered
          original_cfg = pr._cfg
          original_generate = pr._gemini_generate
          original_chat = pr._chat
          calls = []
          try:
              # Deterministically exercise the same provider loop used in production.
              pr._ordered = lambda image: ['gemini', 'cerebras']
              pr._cfg = lambda p: ('https://example.invalid', 'test-key', 'test-model', bool(p.get('vision')), 'test')
              def fake_generate(*args, **kwargs):
                  calls.append('gemini')
                  raise RuntimeError('simulated Gemini quota')
              def fake_chat(*args, **kwargs):
                  calls.append('cerebras')
                  return '{"ok":true}'
              pr._gemini_generate = fake_generate
              pr._chat = fake_chat
              raw, provider = pr.call('system','user')
              assert calls == ['gemini', 'cerebras'], calls
              assert provider == 'cerebras', (provider, raw)
              assert raw == '{"ok":true}', raw
              print('Cloud router failover contract passed: Gemini failure -> Cerebras success')
          finally:
              pr._ordered = original_ordered
              pr._cfg = original_cfg
              pr._gemini_generate = original_generate
              pr._chat = original_chat
          PY
      - name: Verify UCOA runtime contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q
      - name: Verify Gemini vision API when quota allows
        if: steps.gemini_text.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw
          img=Image.new('RGB',(160,90),'white'); d=ImageDraw.Draw(img)
          d.rectangle((48,32,112,58),fill='#dddddd',outline='black'); d.text((55,39),'CONTINUE',fill='black')
          img.save('/tmp/continue.jpg',format='JPEG',quality=75,optimize=True)
          PY
          IMAGE_B64="$(base64 -w0 /tmp/continue.jpg)"
          body=$(curl --http1.1 -sS --connect-timeout 10 --max-time 45 \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            --data-binary "{\"contents\":[{\"parts\":[{\"text\":\"Look at the image. Reply with exactly CONTINUE if a button labeled CONTINUE is visible.\"},{\"inline_data\":{\"mime_type\":\"image/jpeg\",\"data\":\"$IMAGE_B64\"}}]}],\"generationConfig\":{\"temperature\":0,\"maxOutputTokens\":64,\"thinkingConfig\":{\"thinkingLevel\":\"low\"}}}" )
          echo "$body"
          python - <<'PY' "$body"
          import json,sys
          x=json.loads(sys.argv[1]); assert not x.get('error'),x
          txt=''.join(p.get('text','') for p in x.get('candidates',[{}])[0].get('content',{}).get('parts',[]) if isinstance(p,dict))
          assert 'CONTINUE' in txt,x
          print('Gemini native vision generation passed')
          PY
      - name: Release validation marker
        run: |
          echo "Cloud routing contract passed; Gemini direct path status=${{ steps.gemini_text.outcome }}"
