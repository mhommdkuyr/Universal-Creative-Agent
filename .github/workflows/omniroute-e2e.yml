name: OmniRoute E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '59 */12 * * *'

concurrency:
  group: omniroute-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for OmniRoute
        env:
          OMNI_URL: https://ucoa-omniroute-image.onrender.com
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/models.json -w '%{http_code}' --max-time 5 "$OMNI_URL/v1/models" || true)
            echo "models HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/models.json; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Exercise OpenAI-compatible multimodal inference
        env:
          OMNI_URL: https://ucoa-omniroute-image.onrender.com
          OMNIROUTE_API_KEY: ${{ secrets.UCOA_OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          png = base64.b64encode(bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000d49444154789c6360f8cf00000003000100d2c4a4f70000000049454e44ae426082')).decode()
          body={"model":"auto","temperature":0,"max_tokens":64,"messages":[{"role":"user","content":[{"type":"text","text":"Return ONLY JSON: {\\"action\\":\\"observe\\",\\"confidence\\":number}. Confirm you can inspect this image."},{"type":"image_url","image_url":{"url":"data:image/png;base64,"+png}}]}]}
          req=urllib.request.Request(os.environ['OMNI_URL']+'/v1/chat/completions',data=json.dumps(body).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ.get('OMNIROUTE_API_KEY','')},method='POST')
          with urllib.request.urlopen(req,timeout=60) as r: result=json.loads(r.read().decode())
          print(json.dumps(result,ensure_ascii=False))
          assert result.get('choices'), result
          assert result['choices'][0].get('message',{}).get('content'), result
          PY
