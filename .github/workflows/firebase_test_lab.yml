name: Firebase Test Lab Android Physical Acceptance

on:
  push:
    branches:
      - main
      - 'codex/firebase-testlab-physical-acceptance'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-test-lab-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  firebase-test-lab-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      APK: android/app/build/outputs/apk/debug/app-debug.apk
      TEST_APK: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Firebase credential secret is available
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY" || { echo "GCP_SA_KEY is missing." >&2; exit 2; }

      - name: Build Debug and Instrumentation Test APKs
        run: |
          set -euo pipefail
          gradle -p android assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify APK artifacts and hashes
        run: |
          set -euo pipefail
          test -s "$APK"
          test -s "$TEST_APK"
          sha256sum "$APK" "$TEST_APK" | tee firebase-apk-sha256.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Firebase Test Lab required API
        run: |
          set -euo pipefail
          PROJECT="$(gcloud config get-value project)"
          gcloud services enable toolresults.googleapis.com --project="$PROJECT"

      - name: Grant temporary Editor role required by Firebase default results bucket
        run: |
          set -euo pipefail
          PROJECT="$(gcloud config get-value project)"
          ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n1)"
          test -n "$ACCOUNT"
          HAS_EDITOR="$(gcloud projects get-iam-policy "$PROJECT" \
            --flatten='bindings[].members' \
            --filter="bindings.members=serviceAccount:$ACCOUNT AND bindings.role=roles/editor" \
            --format='value(bindings.role)' | head -n1)"
          if [ "$HAS_EDITOR" = "roles/editor" ]; then
            echo "EDITOR_ROLE_ALREADY_PRESENT=true" >> "$GITHUB_ENV"
          else
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:$ACCOUNT" \
              --role="roles/editor" \
              --condition=None
            echo "EDITOR_ROLE_ALREADY_PRESENT=false" >> "$GITHUB_ENV"
          fi
          echo "Waiting for IAM propagation..."
          for i in $(seq 1 12); do
            if gcloud projects get-iam-policy "$PROJECT" \
              --flatten='bindings[].members' \
              --filter="bindings.members=serviceAccount:$ACCOUNT AND bindings.role=roles/editor" \
              --format='value(bindings.role)' | grep -qx 'roles/editor'; then
              break
            fi
            sleep 10
          done
          sleep 30

      - name: Verify Google Cloud / Firebase access
        run: |
          set -euo pipefail
          gcloud auth list
          gcloud config get-value project | tee firebase-project.txt
          gcloud firebase test android models list --format=json > ftl-models.json

      - name: Select an available physical Android device and version
        id: device
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path('ftl-models.json').read_text())
          models = data.get('models', data) if isinstance(data, dict) else data
          candidates = []

          for model in models:
              if str(model.get('form', '')).upper() != 'PHYSICAL':
                  continue
              model_id = model.get('id') or model.get('modelId')
              if not model_id:
                  continue
              for info in model.get('perVersionInfo') or []:
                  version = str(info.get('versionId') or '')
                  if not version:
                      continue
                  direct = bool((info.get('directAccessVersionInfo') or {}).get('directAccessSupported'))
                  estimate = info.get('interactiveDeviceAvailabilityEstimate')
                  capacity = str(info.get('deviceCapacity') or '')
                  candidates.append({
                      'model': model_id,
                      'version': version,
                      'name': model.get('name'),
                      'direct': direct,
                      'estimate': estimate,
                      'capacity': capacity,
                  })

          if not candidates:
              raise SystemExit('Firebase returned no physical device/version combinations')

          def score(c):
              estimate_score = 0 if c['estimate'] == '30s' else (1 if c['estimate'] is None else 2)
              direct_score = 0 if c['direct'] else 1
              capacity_score = {
                  'DEVICE_CAPACITY_HIGH': 0,
                  'DEVICE_CAPACITY_MEDIUM': 1,
                  'DEVICE_CAPACITY_LOW': 2,
              }.get(c['capacity'], 3)
              return (estimate_score, direct_score, capacity_score, c['model'], c['version'])

          candidates.sort(key=score)
          chosen = candidates[0]

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"DEVICE_MODEL={chosen['model']}\nDEVICE_VERSION={chosen['version']}\nDEVICE_FORM=PHYSICAL\n")
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"DEVICE_MODEL={chosen['model']}\nDEVICE_VERSION={chosen['version']}\nDEVICE_FORM=PHYSICAL\n")

          print(json.dumps(chosen, indent=2, ensure_ascii=False))
          PY

      - name: Run AccessibilityService instrumentation on Firebase Test Lab physical device
        id: ftl
        run: |
          set +e
          RESULTS_DIR="ucoa/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud firebase test android run \
            --type instrumentation \
            --app "$APK" \
            --test "$TEST_APK" \
            --device "model=${{ steps.device.outputs.DEVICE_MODEL }},version=${{ steps.device.outputs.DEVICE_VERSION }},locale=en,orientation=portrait" \
            --environment-variables clearPackageData=true \
            --results-dir "$RESULTS_DIR" \
            --client-details matrixLabel="UCOA physical AccessibilityService acceptance" \
            --format=json > ftl-result.json 2> ftl-stderr.log
          RC=$?
          if [ "$RC" -ne 0 ] && grep -q 'storage.objects.create' ftl-stderr.log; then
            echo "Detected Test Lab managed-bucket IAM propagation failure; retrying once..."
            sleep 60
            gcloud firebase test android run \
              --type instrumentation \
              --app "$APK" \
              --test "$TEST_APK" \
              --device "model=${{ steps.device.outputs.DEVICE_MODEL }},version=${{ steps.device.outputs.DEVICE_VERSION }},locale=en,orientation=portrait" \
              --environment-variables clearPackageData=true \
              --results-dir "${RESULTS_DIR}-retry" \
              --client-details matrixLabel="UCOA physical AccessibilityService acceptance retry" \
              --format=json > ftl-result.json 2> ftl-stderr.log
            RC=$?
          fi
          set -e
          printf '%s\n' "$RC" > firebase-command-exit.txt
          echo "GCP_RUN_RC=$RC" >> "$GITHUB_ENV"
          echo "gcloud return code: $RC"
          echo '--- ftl-result.json ---'
          cat ftl-result.json || true
          echo '--- ftl-stderr.log ---'
          cat ftl-stderr.log || true

      - name: Collect Firebase raw device results
        if: always()
        run: |
          set +e
          mkdir -p ftl-raw-results
          RESULT_URI="$(sed -n 's/.*\[https:\/\/console\.developers\.google\.com\/storage\/browser\/\([^]]*\)\/\].*/gs:\/\/\1/p' ftl-stderr.log | head -n1)"
          if [ -n "$RESULT_URI" ]; then
            echo "$RESULT_URI" > firebase-results-uri.txt
            gcloud storage cp --recursive "$RESULT_URI" ftl-raw-results/ > ftl-raw-download.log 2>&1
          else
            echo "No raw Firebase results URI was found in ftl-stderr.log" > ftl-raw-download.log
          fi
          set -e

      - name: Validate Firebase Test Lab completed and passed
        run: |
          set -euo pipefail
          RC="$(cat firebase-command-exit.txt)"
          test -n "$RC"

          test -s firebase-matrix.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          d = json.loads(Path('firebase-matrix.json').read_text())
          state = str(d.get('state', '')).upper()
          outcome = str(d.get('outcomeSummary', '')).upper()
          executions = d.get('testExecutions') or []

          print('state=', state)
          print('outcomeSummary=', outcome)
          print('executionCount=', len(executions))
          if not executions:
              raise SystemExit('Firebase Test Matrix contains no test executions.')

          for i, ex in enumerate(executions):
              print(f'execution[{i}]=', json.dumps(ex, ensure_ascii=False)[:1800])

          if state != 'FINISHED':
              raise SystemExit(f'Firebase Test Matrix is not terminal: {state}')
          if outcome not in {'SUCCESS', 'PASSED'}:
              raise SystemExit(f'Firebase Test Matrix did not pass: {outcome}')
          if int(os.environ.get('RC', '0') or '0') != 0:
              raise SystemExit('Firebase gcloud command returned non-zero.')
          
          matrix_id = Path('firebase-matrix-id.txt').read_text().strip()
          if not matrix_id:
              raise SystemExit('Firebase matrix id is missing.')

          Path('firebase-status.txt').write_text(
              'STATUS=SUCCESS\n'
              f'DEVICE_MODEL={os.environ.get("DEVICE_MODEL","")}\n'
              f'DEVICE_VERSION={os.environ.get("DEVICE_VERSION","")}\n'
              f'MATRIX_ID={matrix_id}\n'
              f'OUTCOME_SUMMARY={outcome}\n'
          )
          PY

      - name: Upload verified Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-verified-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Revoke temporary Editor role after Firebase test
        if: always() && env.EDITOR_ROLE_ALREADY_PRESENT == 'false'
        run: |
          set +e
          PROJECT="$(gcloud config get-value project 2>/dev/null || true)"
          ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' 2>/dev/null | head -n1 || true)"
          if [ -n "$PROJECT" ] && [ -n "$ACCOUNT" ]; then
            gcloud projects remove-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:$ACCOUNT" \
              --role="roles/editor" \
              --all || true
          fi
          set -e

      - name: Upload Firebase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-physical-evidence
          path: |
            ftl-result.json
            ftl-stderr.log
            ftl-models.json
            firebase-project.txt
            firebase-apk-sha256.txt
            firebase-status.txt
            firebase-command-exit.txt
            firebase-results-uri.txt
            ftl-raw-download.log
            ftl-raw-results/**
          if-no-files-found: warn
          retention-days: 30
