name: Firebase Test Lab Android Physical Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-test-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firebase-test-lab-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      APK: android/app/build/outputs/apk/debug/app-debug.apk
      TEST_APK: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Firebase credential secret is available
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY" || { echo "GCP_SA_KEY is missing; Firebase Test Lab cannot run." >&2; exit 2; }

      - name: Build Debug and Instrumentation Test APKs
        run: |
          set -euo pipefail
          gradle -p android assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify APK artifacts and hashes
        run: |
          set -euo pipefail
          test -s "$APK"
          test -s "$TEST_APK"
          sha256sum "$APK" "$TEST_APK" | tee firebase-apk-sha256.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Firebase Test Lab required API
        run: |
          set -euo pipefail
          PROJECT="$(gcloud config get-value project)"
          gcloud services enable toolresults.googleapis.com --project="$PROJECT"
          gcloud services list --enabled --filter='config.name=toolresults.googleapis.com' --format='value(config.name)'

      - name: Verify Google Cloud / Firebase access
        run: |
          set -euo pipefail
          gcloud auth list
          gcloud config get-value project | tee firebase-project.txt
          gcloud firebase test android models list --format=json > ftl-models.json

      - name: Select a physical Android device and version
        id: device
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('ftl-models.json').read_text())
          models = data.get('models') if isinstance(data, dict) else data
          if not isinstance(models, list):
              raise SystemExit('Unexpected Firebase models response format')

          def versions_for(model):
              supported = [str(v) for v in (model.get('supportedVersionIds') or [])]
              if supported:
                  return supported
              return [
                  str(v.get('versionId'))
                  for v in (model.get('perVersionInfo') or [])
                  if isinstance(v, dict) and v.get('versionId')
              ]

          physical = [m for m in models if str(m.get('form', '')).upper() == 'PHYSICAL']
          candidates = [(m, v) for m in physical for v in versions_for(m)]
          if not candidates:
              raise SystemExit('Firebase returned no physical device/version combinations')

          preferred = [
              pair for pair in candidates
              if (pair[0].get('id') or pair[0].get('modelId')) == 'oriole' and pair[1] == '33'
          ]
          chosen, version = preferred[0] if preferred else candidates[0]
          model_id = chosen.get('id') or chosen.get('modelId')
          if not model_id:
              raise SystemExit(f'Invalid Firebase physical device record: {chosen}')

          out_path = os.environ['GITHUB_OUTPUT']
          env_path = os.environ['GITHUB_ENV']
          with open(out_path, 'a', encoding='utf-8') as out:
              out.write(f'DEVICE_MODEL={model_id}\n')
              out.write(f'DEVICE_VERSION={version}\n')
              out.write('DEVICE_FORM=PHYSICAL\n')
          with open(env_path, 'a', encoding='utf-8') as env:
              env.write(f'DEVICE_MODEL={model_id}\n')
              env.write(f'DEVICE_VERSION={version}\n')
              env.write('DEVICE_FORM=PHYSICAL\n')

          print(json.dumps({
              'model': model_id,
              'version': version,
              'form': chosen.get('form'),
              'name': chosen.get('name'),
              'manufacturer': chosen.get('manufacturer'),
              'perVersionInfo': chosen.get('perVersionInfo', []),
          }, indent=2))
          PY

      - name: Run AccessibilityService instrumentation on Firebase Test Lab physical device
        id: ftl
        run: |
          set +e
          gcloud firebase test android run \
            --type instrumentation \
            --app "$APK" \
            --test "$TEST_APK" \
            --device "model=${{ steps.device.outputs.DEVICE_MODEL }},version=${{ steps.device.outputs.DEVICE_VERSION }},locale=en,orientation=portrait" \
            --environment-variables clearPackageData=true \
            --format=json > ftl-result.json 2> ftl-stderr.log
          RC=$?
          set -e
          echo "gcloud firebase test return code: $RC"
          cat ftl-result.json || true
          cat ftl-stderr.log || true
          echo "GCP_RUN_RC=$RC" >> "$GITHUB_ENV"

      - name: Validate Firebase Test Lab completed and passed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path('ftl-result.json')
          if not p.exists():
              raise SystemExit('Firebase Test Lab did not produce a result file')

          raw = p.read_text(errors='replace').strip()
          if not raw:
              raise SystemExit('Firebase Test Lab result is empty')

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'Firebase result was not valid JSON: {exc}')

          matrices = []
          def walk(value):
              if isinstance(value, dict):
                  if 'testMatrixId' in value or 'outcomeSummary' in value:
                      matrices.append(value)
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)

          matrix_ids = [m.get('testMatrixId') for m in matrices if m.get('testMatrixId')]
          outcomes = [str(m.get('outcomeSummary', '')).upper() for m in matrices if m.get('outcomeSummary')]
          states = [str(m.get('state', '')).upper() for m in matrices if m.get('state')]
          print('matrix_ids=', matrix_ids)
          print('outcomes=', outcomes)
          print('states=', states)

          rc = int(os.environ.get('GCP_RUN_RC', '99'))
          if rc != 0:
              raise SystemExit(f'Firebase Test Lab command failed with return code {rc}')
          if 'PASSED' not in outcomes:
              raise SystemExit('Firebase Test Lab did not report PASSED; physical-device acceptance is not successful.')

          Path('firebase-status.txt').write_text(
              'STATUS=SUCCESS\n'
              f"DEVICE_MODEL={os.environ.get('DEVICE_MODEL', '')}\n"
              f"DEVICE_VERSION={os.environ.get('DEVICE_VERSION', '')}\n"
              f"MATRIX_IDS={','.join(matrix_ids)}\n"
          )
          PY

      - name: Upload Firebase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-physical-evidence
          path: |
            ftl-result.json
            ftl-stderr.log
            ftl-models.json
            firebase-project.txt
            firebase-apk-sha256.txt
            firebase-status.txt
          if-no-files-found: warn
          retention-days: 30
