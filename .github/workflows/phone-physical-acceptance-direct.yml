name: Direct Physical Android Acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phone-physical-acceptance-direct.yml"
      - "server/device_bridge.py"
      - "server/production_overrides.py"
      - "server/provider_router.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  physical-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for live Android client
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ucoa-agent-brain.onrender.com
          get_token() {
            curl --fail --silent --show-error               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ucoa-live-phone" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          for i in $(seq 1 120); do
            token="$(get_token)"
            code="$(curl -sS -o /tmp/devices.json -w "%{http_code}"               -H "Authorization: Bearer ${token}"               "${BASE}/v1/qa/phone/devices" || true)"
            echo "devices_http=${code} attempt=${i}"
            if [ "${code}" = "200" ]; then
              cat /tmp/devices.json
              count="$(python3 -c 'import json; print(len(json.load(open("/tmp/devices.json")).get("devices") or []))')"
              if [ "${count}" -gt 0 ]; then
                exit 0
              fi
            fi
            sleep 2
          done
          exit 1

      - name: Execute Settings task
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ucoa-agent-brain.onrender.com
          get_token() {
            curl --fail --silent --show-error               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ucoa-live-phone" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          body="$(python3 - <<'PY'
import json
print(json.dumps({
  "kind":"task",
  "task":"اختبار قبول حقيقي: افتح تطبيق الإعدادات فقط، ولا تغيّر أي إعداد. لا تعلن النجاح إلا بعد إثبات com.android.settings عبر Accessibility tree ولقطة الشاشة من الجهاز نفسه.",
  "metadata":{"qa_suite":"direct-physical-acceptance","evidence_required":True,"no_external_success":True}
},ensure_ascii=False))
PY
)"
          token="$(get_token)"
          queued="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${token}" -H "Content-Type: application/json"             -d "${body}" "${BASE}/v1/qa/phone/commands")"
          echo "${queued}" > /tmp/queued-settings.json
          command_id="$(python3 -c 'import json; print(json.load(open("/tmp/queued-settings.json"))["command_id"])')"
          for i in $(seq 1 120); do
            token="$(get_token)"
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer ${token}"               "${BASE}/v1/qa/phone/commands/${command_id}")"
            echo "${state}" > /tmp/settings-state.json
            status="$(python3 -c 'import json; print(json.load(open("/tmp/settings-state.json"))["command"]["status"])')"
            echo "settings_poll=${i} status=${status}"
            if [[ "${status}" = "completed" || "${status}" = "failed" || "${status}" = "cancelled" ]]; then break; fi
            sleep 2
          done
          python3 - <<'PY'
import json,sys
d=json.load(open("/tmp/settings-state.json"))["command"]
print(json.dumps(d,ensure_ascii=False,indent=2))
r=d.get("result") or {}
assert d["status"]=="completed", d
assert r.get("completion_verified_by_ucoa") is True, r
assert r.get("final_foreground")=="com.android.settings", r
assert int(r.get("steps",0) or 0)>0, r
assert r.get("final_screenshot_evidence") is True or r.get("screenshot_evidence") is True, r
PY

      - name: Execute compound task
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ucoa-agent-brain.onrender.com
          get_token() {
            curl --fail --silent --show-error               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ucoa-live-phone" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          body="$(python3 - <<'PY'
import json
print(json.dumps({
  "kind":"task",
  "task":"مهمة مركبة حقيقية: افتح الإعدادات، ثم افتح قسم Wi-Fi إن كان ظاهرًا، ولا تغيّر أي إعداد. تحقق من الشاشة النهائية من Accessibility tree ولقطة الشاشة، ولا تعتبر فتح تطبيق آخر أو بقاء ChatGPT نجاحًا.",
  "metadata":{"qa_suite":"direct-physical-compound","evidence_required":True,"no_external_success":True}
},ensure_ascii=False))
PY
)"
          token="$(get_token)"
          queued="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${token}" -H "Content-Type: application/json"             -d "${body}" "${BASE}/v1/qa/phone/commands")"
          echo "${queued}" > /tmp/queued-compound.json
          command_id="$(python3 -c 'import json; print(json.load(open("/tmp/queued-compound.json"))["command_id"])')"
          for i in $(seq 1 180); do
            token="$(get_token)"
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer ${token}"               "${BASE}/v1/qa/phone/commands/${command_id}")"
            echo "${state}" > /tmp/compound-state.json
            status="$(python3 -c 'import json; print(json.load(open("/tmp/compound-state.json"))["command"]["status"])')"
            echo "compound_poll=${i} status=${status}"
            if [[ "${status}" = "completed" || "${status}" = "failed" || "${status}" = "cancelled" ]]; then break; fi
            sleep 2
          done
          cat /tmp/compound-state.json
          python3 - <<'PY'
import json
d=json.load(open("/tmp/compound-state.json"))["command"]
assert d["status"]=="completed", d
r=d.get("result") or {}
assert r.get("completion_verified_by_ucoa") is True, r
assert int(r.get("steps",0) or 0)>0, r
PY

      - name: Upload physical acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-direct-physical-acceptance
          path: |
            /tmp/settings-state.json
            /tmp/compound-state.json
          if-no-files-found: ignore
          retention-days: 14
