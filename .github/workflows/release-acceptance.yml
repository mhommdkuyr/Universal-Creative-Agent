name: Release Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/provider_router.py'
      - 'server/app.py'
      - 'server/ci_capcut_e2e.sh'
      - 'server/requirements.txt'
      - 'android/**'
      - '.github/workflows/release-acceptance.yml'

concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Production health
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 5 https://ucoa-agent-brain.onrender.com/health || true)
            echo "health HTTP=$code"
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Live provider contract
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://ucoa-agent-brain.onrender.com/v1/providers/probe -o /tmp/providers.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/providers.json'))
          good=[p for p in d.get('providers',[]) if p.get('ok')]
          assert good, d
          print('usable providers:', [(p['provider'], p['latency_s']) for p in good])
          PY
      - name: Live multimodal contract
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://ucoa-agent-brain.onrender.com/v1/providers/probe-vision -o /tmp/vision.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/vision.json'))
          assert d.get('ok'), d
          assert d.get('provider'), d
          assert d.get('detected_target') == 'CONTINUE', d
          print('vision provider:', d['provider'], 'confidence:', d.get('confidence'))
          PY

  android-capcut:
    needs: live-brain
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android assembleDebug --stacktrace
      - name: Cache CapCut APK
        uses: actions/cache@v4
        with:
          path: .cache/capcut
          key: capcut-apk-v1-${{ runner.os }}
      - name: Prepare cache
        run: mkdir -p .cache/capcut
      - name: Record virtualization
        run: |
          if [ -e /dev/kvm ]; then echo "KVM_AVAILABLE=true"; else echo "KVM_AVAILABLE=false"; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
            test -n "$AAPT_PATH"
            export PATH="$(dirname "$AAPT_PATH"):$PATH"
            export CAPCUT_APK_PATH="$GITHUB_WORKSPACE/.cache/capcut/capcut.apk"
            export UCOA_APK_PATH="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$UCOA_APK_PATH"
            bash ./server/ci_capcut_e2e.sh
