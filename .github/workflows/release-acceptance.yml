name: Release Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/provider_router.py'
      - 'server/app.py'
      - 'server/remote_ops.py'
      - 'server/ci_capcut_e2e.sh'
      - 'server/ci_render_v3_smoke.py'
      - 'server/requirements.txt'
      - 'android/**'
      - '.github/workflows/android-smoke.yml'
      - '.github/workflows/release-acceptance.yml'

concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke dependencies
        run: python -m pip install --disable-pip-version-check pillow
      - name: Production health
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 5 https://ucoa-agent-brain.onrender.com/health || true)
            echo "health HTTP=$code"
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Live provider contract
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 https://ucoa-agent-brain.onrender.com/v1/providers/probe -o /tmp/providers.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/providers.json'))
          good=[p for p in d.get('providers',[]) if p.get('ok')]
          assert good, d
          print('usable providers:', [(p.get('provider'), p.get('model'), p.get('latency_s', 'n/a')) for p in good])
          PY
      - name: Live multimodal agent contract
        run: |
          set -euo pipefail
          python server/ci_render_v3_smoke.py plan
          python server/ci_render_v3_smoke.py step
          python server/ci_render_v3_smoke.py state
      - name: Client session + remote config contract
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://ucoa-agent-brain.onrender.com/v1/client/config -o /tmp/client-config.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/client-config.json'))
          assert d.get('ok') is True, d
          assert d.get('features',{}).get('remote_config') is True, d
          assert d.get('features',{}).get('server_side_hotfix') is True, d
          print('remote config revision:', d.get('revision'))
          PY
      - name: Optional vision probe diagnostic
        continue-on-error: true
        run: |
          curl -fsS --max-time 90 https://ucoa-agent-brain.onrender.com/v1/providers/probe-vision -o /tmp/vision.json || true
          cat /tmp/vision.json || true

  android-capcut:
    needs: live-brain
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android assembleDebug --stacktrace
      - name: Assert APK is thin cloud client
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c '%s' "$APK")
          echo "APK bytes=$SIZE"
          test "$SIZE" -lt 41943040
          if unzip -l "$APK" | grep -E 'ucoa_local_model|litertlm'; then
            echo 'Bundled model/runtime detected in thin client APK'
            exit 1
          fi
      - name: Cache CapCut APK
        uses: actions/cache@v4
        with:
          path: .cache/capcut
          key: capcut-apk-v1-${{ runner.os }}
      - name: Prepare cache
        run: mkdir -p .cache/capcut
      - name: Enable KVM for emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: Record virtualization
        run: |
          if [ -e /dev/kvm ]; then echo "KVM_AVAILABLE=true"; else echo "KVM_AVAILABLE=false"; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: arm64-v8a
          profile: pixel_2
          cores: 4
          force-avd-creation: true
          working-directory: .
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            pwd
            test -s ./android/app/build/outputs/apk/debug/app-debug.apk
            CAPCUT_APK_PATH="$PWD/.cache/capcut/capcut.apk" UCOA_APK_PATH="$PWD/android/app/build/outputs/apk/debug/app-debug.apk" bash ./server/ci_capcut_e2e.sh
      - name: Upload verified release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ucoa-release-verified-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
