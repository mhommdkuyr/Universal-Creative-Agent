plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.ucoa.app'
    compileSdk 35
    defaultConfig { applicationId 'com.ucoa.app'; minSdk 26; targetSdk 35; versionCode 9; versionName '0.9.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

def localModelUrl = 'https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/qwen3_0_6b_mixed_int4.litertlm'
def localModelFile = file("$projectDir/src/main/assets/ucoa_local_model.litertlm")
def localModelMinBytes = 400_000_000L

tasks.register('downloadUcoaLocalModel') {
    outputs.file(localModelFile)
    outputs.upToDateWhen { localModelFile.exists() && localModelFile.length() >= localModelMinBytes }
    doLast {
        localModelFile.parentFile.mkdirs()
        if (!localModelFile.exists() || localModelFile.length() < localModelMinBytes) {
            logger.lifecycle("Downloading UCOA embedded local model (~475 MB)…")
            def connection = new URL(localModelUrl).openConnection()
            connection.setConnectTimeout(60_000)
            connection.setReadTimeout(300_000)
            connection.setRequestProperty('User-Agent', 'Universal-Creative-Agent/0.9')
            connection.connect()
            connection.getInputStream().withCloseable { input ->
                localModelFile.withOutputStream { output ->
                    byte[] buffer = new byte[1024 * 1024]
                    long total = 0
                    int read
                    while ((read = input.read(buffer)) != -1) {
                        output.write(buffer, 0, read)
                        total += read
                        if (total % (50L * 1024L * 1024L) < read) {
                            logger.lifecycle("Local model downloaded: ${total / (1024 * 1024)} MB")
                        }
                    }
                }
            }
        }
        if (!localModelFile.exists() || localModelFile.length() < localModelMinBytes) {
            throw new GradleException("Embedded local model download is incomplete: ${localModelFile.length()} bytes")
        }
        logger.lifecycle("Embedded local model ready: ${localModelFile.length()} bytes")
    }
}

tasks.named('preBuild').configure { dependsOn(tasks.named('downloadUcoaLocalModel')) }

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
