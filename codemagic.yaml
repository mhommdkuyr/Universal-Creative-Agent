workflows:
  android-native-gradle:
    name: UCOA Native Android Gradle Acceptance
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Prepare Android SDK and verified local model
        script: |
          set -euo pipefail
          SDKMANAGER=""
          for candidate in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "$HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$CM_BUILD_DIR/android/app/src/main/assets"
          MODEL="$CM_BUILD_DIR/android/app/src/main/assets/ucoa_local_model.litertlm"
          if [ ! -s "$MODEL" ]; then curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 -o "$MODEL" "https://huggingface.co/litert-community/Qwen3-0.6B-int4/resolve/main/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm?download=true"; fi
          test "$(stat -f%z "$MODEL")" -gt 300000000
          printf '%s  %s\n' "2df6821ec12702dafd33915e7a1a1adc7c4b053f3672fd9555dfaf3a114c4139" "$MODEL" | shasum -a 256 -c -
      - name: Assemble native Android APK with Gradle
        script: |
          set -euo pipefail
          mkdir -p "$HOME/gradle"
          if [ ! -x "$HOME/gradle/gradle-8.11.1/bin/gradle" ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
            rm -rf "$HOME/gradle/gradle-8.11.1"
            unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          fi
          "$HOME/gradle/gradle-8.11.1/bin/gradle" -p android assembleDebug --stacktrace
      - name: Verify APK, embedded local model and checksum
        script: |
          set -euo pipefail
          APK="$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/ucoa_local_model.litertlm'
          shasum -a 256 "$APK" | tee "$CM_BUILD_DIR/ucoa_apk_sha256.txt"
          echo "UCOA_NATIVE_GRADLE_APK_READY size=$(stat -f%z "$APK")"
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - ucoa_apk_sha256.txt
